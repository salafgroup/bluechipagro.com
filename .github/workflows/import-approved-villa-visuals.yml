name: Import approved villa visual release
on:
  push:
    branches: ['feat/villa-visuals-20261023']
    paths: ['.github/workflows/import-approved-villa-visuals.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'salafgroup/bluechipagro.com'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and import approved release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: python
        run: |
          import base64, hashlib, io, json, os, urllib.request, zipfile
          repo = 'salafgroup/bluechipagro.com'
          branch = 'feat/villa-visuals-20261023'
          source = 'https://sb-qtxx7tlprz87.vercel.run/approved-villa-release.zip'
          expected_hash = 'a1049238f561971be94dabb3f7b35cdeb901200c3c18549f8a328143d1cc84f2'
          allowed = {
            'index.html', 'reserva-verde/pricing/index.html',
            'models/2bhk-compact-forest-estate/index.html',
            'models/3bhk-premium-forest-estate/index.html',
            'models/4bhk-signature-forest-estate/index.html',
            'models/customisable-founder-estate/index.html',
            'villa-visuals.css', 'villa-visuals.js',
          }
          for model in ['2bhk', '3bhk', '4bhk', 'custom']:
            for suffix in ['', '-720']:
              allowed.add(f'images/villa-concepts-20261023/{model}-exterior{suffix}.webp')
          with urllib.request.urlopen(source, timeout=45) as response:
            archive = response.read(4000001)
          assert len(archive) == 2685269, 'Unexpected archive size'
          assert hashlib.sha256(archive).hexdigest() == expected_hash, 'Archive checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
            assert len(z.namelist()) == 17, 'Unexpected archive entries'
            assert set(z.namelist()) == allowed | {'release-manifest.json'}, 'Unexpected release paths'
            assert sum(x.file_size for x in z.infolist()) < 6000000, 'Unexpected expanded size'
            manifest = json.loads(z.read('release-manifest.json'))
            assert set(manifest) == allowed, 'Manifest paths differ'
            payloads = {name: z.read(name) for name in sorted(allowed)}
          for name, data in payloads.items():
            assert hashlib.sha256(data).hexdigest() == manifest[name], 'File checksum mismatch'
            if name.endswith('.webp'):
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', 'Invalid image format'
          def api(path, data=None, method=None):
            assert path.startswith('/repos/' + repo + '/'), 'Unexpected API scope'
            request = urllib.request.Request('https://api.github.com' + path,
              data=None if data is None else json.dumps(data).encode(),
              method=method or ('GET' if data is None else 'POST'),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json',
                       'User-Agent': 'approved-villa-release',
                       'X-GitHub-Api-Version': '2022-11-28'})
            with urllib.request.urlopen(request, timeout=45) as response:
              return json.load(response)
          prefix = '/repos/' + repo
          head = api(prefix + '/git/ref/heads/' + branch)['object']['sha']
          assert head == os.environ['EXPECTED_HEAD'], 'Branch moved; refusing stale import'
          original = api(prefix + '/git/commits/' + head)
          tree_entries = []
          for name, data in payloads.items():
            blob = api(prefix + '/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
            tree_entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = api(prefix + '/git/trees', {'base_tree': original['tree']['sha'], 'tree': tree_entries})
          commit = api(prefix + '/git/commits', {
            'message': 'feat: use approved villa images across pricing and model previews',
            'tree': tree['sha'], 'parents': [head]})
          assert api(prefix + '/git/ref/heads/' + branch)['object']['sha'] == head, 'Branch moved during import'
          api(prefix + '/git/refs/heads/' + branch, {'sha': commit['sha'], 'force': False}, 'PATCH')
          print('Imported', len(payloads), 'verified files. Commit:', commit['sha'])
