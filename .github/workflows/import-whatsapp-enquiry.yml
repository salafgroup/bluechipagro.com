name: Import tested WhatsApp enquiry update
on:
  push:
    branches: ['feat/whatsapp-enquiry-20261023']
    paths: ['.github/workflows/import-whatsapp-enquiry.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'salafgroup/bluechipagro.com'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Import checksum-verified customer page updates
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: python
        run: |
          import base64, hashlib, io, json, os, urllib.request, zipfile
          repo = 'salafgroup/bluechipagro.com'
          branch = 'feat/whatsapp-enquiry-20261023'
          allowed = {'index.html', 'wellness.html', 'reserva-verde/pricing/index.html',
            'models/2bhk-compact-forest-estate/index.html',
            'models/3bhk-premium-forest-estate/index.html',
            'models/4bhk-signature-forest-estate/index.html',
            'models/customisable-founder-estate/index.html', 'whatsapp-enquiry.css'}
          with urllib.request.urlopen('https://sb-5oeww8car5q7.vercel.run/wa-release.zip', timeout=45) as response:
            data = response.read(200001)
          assert len(data) == 148156, 'Archive size mismatch'
          assert hashlib.sha256(data).hexdigest() == 'c5322f4228c9f2a84af0c6743aae93d2d71a22cac3851d99e82eba5aecf4bab3', 'Checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            assert len(z.namelist()) == 9 and set(z.namelist()) == allowed | {'release-manifest.json'}
            assert sum(i.file_size for i in z.infolist()) < 1500000
            manifest = json.loads(z.read('release-manifest.json'))
            assert set(manifest) == allowed
            files = {name: z.read(name) for name in sorted(allowed)}
          for name, content in files.items():
            assert hashlib.sha256(content).hexdigest() == manifest[name], name
            content.decode('utf-8')
          def api(path, data=None, method=None):
            assert path.startswith('/repos/' + repo + '/')
            request = urllib.request.Request('https://api.github.com' + path,
              data=None if data is None else json.dumps(data).encode(),
              method=method or ('GET' if data is None else 'POST'),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json', 'User-Agent': 'whatsapp-enquiry-release',
                       'X-GitHub-Api-Version': '2022-11-28'})
            with urllib.request.urlopen(request, timeout=45) as response:
              return json.load(response)
          prefix = '/repos/' + repo
          head = api(prefix + '/git/ref/heads/' + branch)['object']['sha']
          assert head == os.environ['EXPECTED_HEAD'], 'Branch moved'
          original = api(prefix + '/git/commits/' + head)
          entries = []
          for name, content in files.items():
            blob = api(prefix + '/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
            entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          entries.append({'path': '.github/workflows/import-whatsapp-enquiry.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api(prefix + '/git/trees', {'base_tree': original['tree']['sha'], 'tree': entries})
          commit = api(prefix + '/git/commits', {'message': 'feat: add WhatsApp enquiry to +91 9686111408 across client pages', 'tree': tree['sha'], 'parents': [head]})
          assert api(prefix + '/git/ref/heads/' + branch)['object']['sha'] == head, 'Branch moved during import'
          api(prefix + '/git/refs/heads/' + branch, {'sha': commit['sha'], 'force': False}, 'PATCH')
          print('Imported', len(files), 'verified files and removed one-time workflow. Commit:', commit['sha'])
