name: Import tested masterplan experience
on:
  push:
    branches: ['feat/masterplan-experience-20261023']
    paths: ['.github/workflows/import-masterplan-experience.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'salafgroup/bluechipagro.com'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and import the tested release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: python
        run: |
          import base64, hashlib, io, json, os, pathlib, urllib.request, zipfile
          repo = 'salafgroup/bluechipagro.com'
          branch = 'feat/masterplan-experience-20261023'
          source = 'https://sb-662xqur3r1dt.vercel.run/qa/masterplan-release.zip'
          expected_hash = 'e44a4cc7b888cb3f7faed4c0de8b1ccc09b26b7411ceecb4ea544b45ede30001'
          code_paths = {'index.html', 'masterplan-experience.css', 'masterplan-experience.js'}
          qa_paths = {'qa/desktop.jpg', 'qa/mobile.jpg'}
          allowed = code_paths | qa_paths
          with urllib.request.urlopen(source, timeout=45) as response:
            archive = response.read(1000001)
          assert len(archive) == 287425, 'Unexpected archive size'
          assert hashlib.sha256(archive).hexdigest() == expected_hash, 'Archive checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
            assert len(z.namelist()) == 6 and set(z.namelist()) == allowed | {'manifest.json'}, 'Unexpected archive paths'
            assert sum(x.file_size for x in z.infolist()) < 2000000, 'Unexpected expanded size'
            manifest = json.loads(z.read('manifest.json'))
            assert set(manifest) == allowed, 'Manifest paths differ'
            payloads = {name: z.read(name) for name in sorted(allowed)}
          for name, data in payloads.items():
            assert hashlib.sha256(data).hexdigest() == manifest[name], 'File checksum mismatch'
          pathlib.Path('qa').mkdir(exist_ok=True)
          for name in qa_paths:
            pathlib.Path(name).write_bytes(payloads[name])
          def api(path, data=None, method=None):
            assert path.startswith('/repos/' + repo + '/'), 'Unexpected API scope'
            request = urllib.request.Request('https://api.github.com' + path,
              data=None if data is None else json.dumps(data).encode(),
              method=method or ('GET' if data is None else 'POST'),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json',
                       'User-Agent': 'masterplan-release',
                       'X-GitHub-Api-Version': '2022-11-28'})
            with urllib.request.urlopen(request, timeout=45) as response:
              return json.load(response)
          prefix = '/repos/' + repo
          head = api(prefix + '/git/ref/heads/' + branch)['object']['sha']
          assert head == os.environ['EXPECTED_HEAD'], 'Branch moved; refusing stale import'
          original = api(prefix + '/git/commits/' + head)
          entries = []
          for name in sorted(code_paths):
            blob = api(prefix + '/git/blobs', {'content': base64.b64encode(payloads[name]).decode(), 'encoding': 'base64'})
            entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          entries.append({'path': '.github/workflows/import-masterplan-experience.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api(prefix + '/git/trees', {'base_tree': original['tree']['sha'], 'tree': entries})
          commit = api(prefix + '/git/commits', {'message': 'feat: upgrade private estate masterplan experience', 'tree': tree['sha'], 'parents': [head]})
          assert api(prefix + '/git/ref/heads/' + branch)['object']['sha'] == head, 'Branch moved during import'
          api(prefix + '/git/refs/heads/' + branch, {'sha': commit['sha'], 'force': False}, 'PATCH')
          print('Imported three tested source files. Commit:', commit['sha'])
      - name: Retain desktop and mobile visual previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: masterplan-preview
          path: qa/*.jpg
          retention-days: 3
          if-no-files-found: error
